services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: cbs_control
      POSTGRES_USER: cbs_control
      POSTGRES_PASSWORD: ${CBS_DB_PASSWORD:?Set CBS_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cbs-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbs_control -d cbs_control"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  cbs-postgres:
