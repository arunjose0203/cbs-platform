# Required secrets and URLs are supplied by the deployment secret store.
# ProductionGuard rejects overrides that would enable development authentication.
cbs:
  banking:
    migrations-enabled: false
  security:
    enabled: true
    allow-local-http: false
spring:
  flyway:
    enabled: false
    clean-disabled: true
    validate-on-migrate: true
  datasource:
    hikari:
      maximum-pool-size: ${CBS_DB_POOL_SIZE:10}
      connection-timeout: 5000
      validation-timeout: 3000
server:
  shutdown: graceful
  # The edge proxy (Caddy) replaces X-Forwarded-For with the real client address. Trust it only from
  # private proxy addresses, so per-client rate limits see clients rather than the proxy. The app port
  # must stay reachable from the edge proxy only (deploy/staging/compose.yml publishes no app port).
  forward-headers-strategy: native
spring.lifecycle.timeout-per-shutdown-phase: 30s
