spring:
  application:
    name: cbs-platform
  datasource:
    url: ${CBS_DB_URL:jdbc:postgresql://localhost:5433/cbs_control}
    username: ${CBS_DB_USER:cbs_control}
    password: ${CBS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

cbs:
  security:
    enabled: ${CBS_SECURITY_ENABLED:false}
    issuer: ${CBS_JWT_ISSUER:}
    jwk-set-uri: ${CBS_JWT_JWKS_URI:}
    audience: ${CBS_JWT_AUDIENCE:}
    allow-local-http: ${CBS_ALLOW_LOCAL_IDENTITY_HTTP:false}
  access:
    local-mfa-bypass-until: ${CBS_LOCAL_MFA_BYPASS_UNTIL:}
    bootstrap-admin-subject: ${CBS_BOOTSTRAP_ADMIN_SUBJECT:}
    idle-timeout: PT15M
    maximum-session-age: PT8H
    maximum-token-age: PT30M
    administrator-mfa-age: PT30M
  privacy:
    # Base64 of 32+ random bytes from the secret store; production refuses a blank or development key.
    field-key: ${CBS_PRIVACY_FIELD_KEY:}
    # Days allowed to answer a data-subject request; confirm with the bank's data protection officer.
    request-due-days: ${CBS_PRIVACY_REQUEST_DUE_DAYS:7}
  notifications:
    # HMAC secret (32+ characters) for signed provider delivery receipts; blank disables the receipt webhook.
    callback-secret: ${CBS_NOTIFICATIONS_CALLBACK_SECRET:}
    notices:
      maturity-days: 7          # term-deposit maturity notice lead time
      loan-due-days: 3          # loan instalment reminder lead time
      arrears-days: 1,30,60,90  # days past due at which an arrears notice is sent
  delivery:
    # P-06: how often approved work is posted to bank databases, and how long one pass may drain a money queue.
    # 30 s is the historical default; 5 s shortens the time from approval to posting. See docs/write-path-performance.md.
    interval-ms: ${CBS_DELIVERY_INTERVAL_MS:30000}
    drain-ms: ${CBS_DELIVERY_DRAIN_MS:20000}
  batch:
    # P-07: banks whose daily cycle is prepared automatically, after this local time in the bank's timezone.
    # The service identity submits; people approve. It must be an active staff identity (and hold FINANCE when duties are enforced).
    banks: ${CBS_BATCH_BANKS:}
    prepare-after: ${CBS_BATCH_PREPARE_AFTER:18:00}
    service-issuer: ${CBS_BATCH_SERVICE_ISSUER:}
    service-subject: ${CBS_BATCH_SERVICE_SUBJECT:}
  portal:
    client-id: ${CBS_PORTAL_CLIENT_ID:}
    redirect-uri: ${CBS_PORTAL_REDIRECT_URI:}
    scope: ${CBS_PORTAL_SCOPE:openid profile email}

server:
  address: ${CBS_BIND_ADDRESS:127.0.0.1}
  port: ${CBS_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
