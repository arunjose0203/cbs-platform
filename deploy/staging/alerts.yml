groups:
  - name: cbs-operations
    rules:
      - alert: CbsApplicationUnavailable
        expr: cbs_readiness_up == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "CBS readiness is failing"}
      - alert: CbsOperationalCheckFailed
        expr: cbs_monitor_alerts > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Check protected CBS monitor output for backup, restore, database or posting failures"}
      - alert: CbsComplianceCasesOverdue
        expr: cbs_compliance_overdue_cases > 0
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Compliance cases are past their investigator due date; review the Overdue filter in Compliance cases"}
      - alert: CbsCustomerNotificationsFailing
        expr: cbs_notifications_failed_24h > 0
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Customer alerts failed after all retries; check the provider and the Failed filter in Customer alerts"}
      - alert: CbsCustomerNotificationsStuck
        expr: cbs_notifications_pending_age_seconds > 3600
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Customer alerts have been queued for over an hour; the SMS/email provider may be unavailable or unbound"}
      - alert: CbsDailyCycleBlocked
        expr: cbs_batch_blocked_banks > 0
        for: 30m
        labels: {severity: warning}
        annotations: {summary: "A bank's scheduled daily cycle is blocked; open the Operations console to see why"}
      - alert: CbsMonitorMissing
        expr: absent(cbs_monitor_last_run_seconds) or (time() - cbs_monitor_last_run_seconds > 180)
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "CBS monitoring has stopped reporting"}
