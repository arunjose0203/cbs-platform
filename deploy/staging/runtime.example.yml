# Secret file, outside the repository, readable by UID 10001 only.
# Fill every placeholder through your secret manager. Use direct PostgreSQL URLs.
spring:
  datasource:
    url: jdbc:postgresql://CONTROL_HOST/cbs_control?sslmode=verify-full
    username: cbs_control_runtime
    password: REPLACE_FROM_SECRET_STORE
cbs:
  security:
    issuer: https://IDENTITY_DOMAIN/realms/cbs
    jwk-set-uri: https://IDENTITY_DOMAIN/realms/cbs/protocol/openid-connect/certs
    audience: cbs-api
  privacy:
    # Base64 of 32 random bytes (openssl rand -base64 32); escrow it with the database backups:
    # without it, encrypted identity document numbers cannot be read.
    field-key: REPLACE_FROM_SECRET_STORE
  portal:
    client-id: cbs-portal
    redirect-uri: https://CBS_DOMAIN/admin/index.html
  banking:
    databases:
      bank-reference:
        url: jdbc:postgresql://BANK_HOST/cbs_bank?sslmode=verify-full
        username: cbs_bank_runtime
        password: REPLACE_FROM_SECRET_STORE
  # Optional operating limits; the values shown are the defaults.
  servicing:
    chunk-size: 500                    # accounts per resumable servicing chunk
  rate-limit:
    enabled: true                      # the production guard refuses false
    requests-per-minute: 600           # per client address, per application instance
    authentication-failures-per-minute: 20
  # notifications:
  #   sender: <provider>               # leave unset until an SMS/email provider is contracted;
  #                                    # alerts then stay PENDING. "test" is refused in production.
