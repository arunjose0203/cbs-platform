name: Verify CBS modules
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_DB: cbs_control
          POSTGRES_USER: cbs_control
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cbs_control -d cbs_control"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CBS_DB_URL: jdbc:postgresql://localhost:5432/cbs_control
      CBS_DB_USER: cbs_control
      CBS_DB_PASSWORD: ci-ephemeral-only
      CBS_INTEGRATION_TESTS: 'true'
      # Same zone as the deployed containers; the pom also pins the test JVM to UTC.
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ops/requirements.txt
      - run: python -m unittest discover -s ops/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui --ignore-scripts
      - run: npm test --prefix ui
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - name: Keep test reports when anything fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
      # Packaging check: the release image builds from the verified JAR and the staging stack resolves.
      # Releases pin JAVA_RUNTIME_IMAGE by digest; CI uses the public tag only to prove the build works.
      - name: Build the application image
        run: docker build --build-arg JAVA_RUNTIME_IMAGE=eclipse-temurin:21-jre-noble -t cbs-platform:ci .
      - name: Validate the staging Compose stack
        run: |
          touch /tmp/runtime.yml /tmp/ca.crt /tmp/identity.env && mkdir -p /tmp/migration
          CBS_APP_IMAGE=cbs-platform:ci CADDY_IMAGE=caddy:2 CBS_RUNTIME_CONFIG=/tmp/runtime.yml \
          CBS_DATABASE_CA=/tmp/ca.crt CBS_MIGRATION_DIRECTORY=/tmp/migration CBS_DOMAIN=cbs.example.org \
          KEYCLOAK_IMAGE=quay.io/keycloak/keycloak:26.7.4 IDENTITY_DOMAIN=id.example.org CBS_IDENTITY_ENV=/tmp/identity.env \
          ACME_EMAIL=ops@example.org docker compose -f deploy/staging/compose.yml --profile tools config --quiet
