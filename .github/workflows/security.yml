name: Dependency security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Fails on high or critical advisories in anything that is bundled into the portal or its build.
      - run: npm audit --prefix ui --audit-level=high
  osv-scan:
    # Scans pom.xml (resolved Maven tree), ui/package-lock.json and ops/requirements.txt against OSV.dev.
    # Results stay in the job log and its artifact: uploading to code scanning needs GitHub Advanced
    # Security on private repositories. The job fails when a known vulnerability is found.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      upload-sarif: false
      scan-args: |-
        --recursive
        ./
