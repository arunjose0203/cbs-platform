name: Promote release
# P-01: promotes a signed release candidate to a final release without rebuilding. The 'production' environment
# must require reviewers (Settings → Environments), so every promotion carries a recorded approval. The job
# verifies the candidate's signature and provenance, then adds the final tag to the same image digest.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Release candidate tag to promote, for example v1.2.0-rc.3
        required: true
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - name: Check the tag names
        run: |
          echo "$CANDIDATE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' || { echo "Not a release candidate tag" >&2; exit 1; }
          echo "FINAL=${CANDIDATE%-rc.*}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Verify the candidate's signature and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$CANDIDATE" --format '{{json .Manifest}}' | jq -r .digest)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          cosign verify "$IMAGE@$digest" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/$CANDIDATE$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          gh attestation verify "oci://$IMAGE@$digest" --repo "${{ github.repository }}"
      - name: Tag the same digest as the final release
        run: docker buildx imagetools create --tag "$IMAGE:$FINAL" "$IMAGE@$DIGEST"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the final release with the candidate's evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "$FINAL" "$CANDIDATE^{commit}" && git push origin "$FINAL"
          mkdir evidence && gh release download "$CANDIDATE" --dir evidence
          (cd evidence && sha256sum --check SHA256SUMS)
          gh release create "$FINAL" --verify-tag --title "Release $FINAL" \
            --notes "Promoted from $CANDIDATE after approval in the production environment. Image: $IMAGE@$DIGEST (signature and provenance verified before promotion)." \
            evidence/*
